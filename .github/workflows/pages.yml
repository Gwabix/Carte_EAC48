# Publication sur GitHub Pages, avec la version du filigrane : la date et le
# hash court du commit publié remplacent le repère de shared/filigrane.js.
# Prérequis (une fois) : Settings > Pages > Build and deployment > Source :
# « GitHub Actions ».
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Version du filigrane
        env:
          TZ: Europe/Paris
        run: |
          VERSION="$(git log -1 --format=%cd --date=format-local:'%d/%m/%Y %H:%M') ($(git rev-parse --short=7 HEAD))"
          sed -i "s|__VERSION_WIDGET__|$VERSION|" shared/filigrane.js
          echo "Version publiée : $VERSION"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
