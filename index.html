<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carte des projets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <span>Filtres</span>
            <div id="header-actions">
                <button id="toggle-hidden-only" title="Afficher seulement les écoles sans projet" aria-pressed="false"
                    class="hidden">
                    <span id="icon-hidden-mode" aria-hidden="true"></span>
                </button>
                <button id="toggle-hidden" title="Afficher/masquer les écoles sans projet" aria-pressed="false">
                    <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="display:none">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                </button>
            </div>
        </div>
        <div id="sidebar-content">
            <div class="filter-section" id="year-section" hidden>
                <h4><label for="year-select">Année scolaire</label></h4>
                <select id="year-select"></select>
            </div>
            <div class="filter-section filter-section-grow">
                <h4>Domaines</h4>
                <div class="filter-list" id="filter-primary"></div>
            </div>
            <div class="filter-section filter-section-grow">
                <h4>Niveaux</h4>
                <div class="filter-list" id="filter-secondary"></div>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <div id="no-config" class="hidden">
        <strong>Configuration requise</strong>
        <span>Veuillez configurer les colonnes dans le panneau du widget Grist (Nom, Latitude, Longitude, Domaines,
            Niveaux). Année scolaire et École sont facultatives mais recommandées.</span>
    </div>

    <div id="school-modal" class="modal-overlay hidden">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <div class="modal-titles">
                    <h2 id="modal-title"></h2>
                    <p id="modal-subtitle"></p>
                </div>
                <div class="modal-actions">
                    <label class="modal-toggle">
                        <input type="checkbox" id="modal-apply-filters" />
                        <span>Limiter aux filtres actifs</span>
                    </label>
                    <button type="button" id="modal-close" title="Fermer" aria-label="Fermer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="shared/grist-columns.js"></script>
    <script src="shared/school-years.js"></script>
    <script src="script.js"></script>
</body>

</html>
